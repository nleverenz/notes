<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Write">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>Write</title>
<style>
html,body{margin:0;height:100%;background:#fff}
textarea{display:block;width:100%;height:100%;box-sizing:border-box;border:0;outline:0;resize:none;padding:6vh 7vw;background:#fff;color:#111;font:32px/1.5 Georgia,serif;caret-color:#111}
</style></head><body>
<textarea id="t" autocapitalize="sentences" spellcheck="false" autocorrect="off" autocomplete="off"></textarea>
<script>
var t=document.getElementById("t");
try{t.value=localStorage.getItem("clear_page")||""}catch(e){}
t.addEventListener("input",function(){try{localStorage.setItem("clear_page",t.value)}catch(e){}});
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}
</script>
</body></html>
